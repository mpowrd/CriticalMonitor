version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --loadmodule /usr/lib/redis/modules/redis-timeseries.so
    volumes:
      - redis_data:/data

  web:
    build:
      context: ../..
      dockerfile: docker/api/Dockerfile
    ports:
      - "80:80"
    environment:
      - REDIS_HOST=redis
      - PORT=80
    depends_on:
      - redis

  measurement-node:
    build:
      context: ../..
      dockerfile: docker/ml/Dockerfile
    environment:
      - ZOOKEEPER_HOST=zookeeper
      - API_URL=http://web/nuevo
    depends_on:
      - web
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

volumes:
  redis_data: